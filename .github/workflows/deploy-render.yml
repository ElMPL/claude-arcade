name: Publicar en Render
# Cuando se aprueba (mergea) un cambio en main, le avisa a Render que vuelva a publicar la página.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Avisar a Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Falta el secreto RENDER_DEPLOY_HOOK (ver README). No se publica automáticamente."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Render está publicando la nueva versión 🚀"
